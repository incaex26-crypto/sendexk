  <div style="position:absolute;left:16px;right:16px;top:20px;height:48px;box-sizing:border-box;padding:0 18px;border-radius:24px;border:1px solid #D5DCE6;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700">
    <span>On the way to Sam</span><span style="color:#2563E8">Arrives around 14:52</span>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:476px;box-sizing:border-box;padding:12px 20px 20px;background:#FFFFFF;border-top:1px solid #D5DCE6;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(15,27,45,0.14);display:flex;flex-direction:column;gap:14px">
    <div style="align-self:center;width:40px;height:4px;border-radius:2px;background:#C5CED9"></div>

    <div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid #D5DCE6;background:#F3F6FA">
      <div style="width:48px;height:48px;border-radius:24px;background:#2563E8;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#FFFFFF">T</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:16px;font-weight:800">Thabo</span><span style="font-size:13px;font-weight:500;color:#5B6B7F">Silver car</span></div>
      <button type="button" aria-label="Call Thabo" style="width:44px;height:44px;border-radius:22px;border:1px solid #D5DCE6;background:#FFFFFF;color:#2563E8;display:flex;align-items:center;justify-content:center;cursor:pointer">

      </button>
    </div>

    <div style="display:flex;flex-direction:column;gap:0">
      <div style="display:flex;align-items:center;gap:12px;min-height:30px"><span style="width:12px;height:12px;border-radius:6px;background:#2563E8;color:#FFFFFF"></span><span style="flex:1;font-size:14px;font-weight:600;color:#5B6B7F">Paid</span><span style="font-size:12px;color:#6B7A8C">14:31</span></div>
      <div style="display:flex;align-items:center;gap:12px;min-height:30px"><span style="width:12px;height:12px;border-radius:6px;background:#2563E8;color:#FFFFFF"></span><span style="flex:1;font-size:14px;font-weight:600;color:#5B6B7F">Driver assigned</span><span style="font-size:12px;color:#6B7A8C">14:32</span></div>
      <div style="display:flex;align-items:center;gap:12px;min-height:30px"><span style="width:12px;height:12px;border-radius:6px;background:#2563E8;color:#FFFFFF"></span><span style="flex:1;font-size:14px;font-weight:600;color:#5B6B7F">Picked up from Zinc Bakery</span><span style="font-size:12px;color:#6B7A8C">14:38</span></div>
      <div style="display:flex;align-items:center;gap:12px;min-height:30px"><span style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:4px solid #2563E8;background:#FFFFFF"></span><span style="flex:1;font-size:15px;font-weight:800">On the way to Sam</span><span style="font-size:12px;color:#2563E8;font-weight:700">Now</span></div>
      <div style="display:flex;align-items:center;gap:12px;min-height:30px"><span style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #8A99AB"></span><span style="flex:1;font-size:14px;font-weight:600;color:#6B7A8C">Delivered</span></div>
    </div>

    <div style="padding:14px;border-radius:16px;border:1px solid #D5DCE6;background:#F3F6FA;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:600;color:#5B6B7F">Delivery code. Share it with the driver when the parcel arrives.</span>
      <div style="display:flex;gap:10px">
        <span style="flex:1;height:52px;border-radius:12px;border:1px solid #D5DCE6;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">4</span>
        <span style="flex:1;height:52px;border-radius:12px;border:1px solid #D5DCE6;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">7</span>
        <span style="flex:1;height:52px;border-radius:12px;border:1px solid #D5DCE6;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">2</span>

      </div>
    </div>
  </div>
</div>
