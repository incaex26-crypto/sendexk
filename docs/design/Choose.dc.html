<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose delivery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#EAF0F5;color:#0F1B2D;font-family:Manrope,sans-serif">
  <img src="map.svg" alt="" style="position:absolute;left:0;top:0;width:390px;height:844px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0;font-family:Manrope,sans-serif">
    <polyline points="150,150 150,240 230,240 230,300 310,300" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="150,150 150,240 230,240 230,300 310,300" fill="none" stroke="#2563E8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="150" r="10" fill="#FFFFFF" stroke="#2563E8" stroke-width="4"/>
    <rect x="301" y="291" width="18" height="18" rx="4" fill="#2563E8" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="38" y="164" width="98" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3DF"/>
    <text x="87" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#0F1B2D">Zinc Bakery</text>
    <rect x="238" y="262" width="108" height="26" rx="13" fill="#FFFFFF" stroke="#C9D3DF"/>
    <text x="292" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#0F1B2D">Sam, Sandton</text>
  </svg>

  <a href="Main.dc.html" aria-label="Back" style="position:absolute;left:16px;top:20px;width:48px;height:48px;border-radius:24px;border:1px solid #D5DCE6;background:#FFFFFF;color:#0F1B2D;display:flex;align-items:center;justify-content:center">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>

  <div style="position:absolute;left:0;right:0;bottom:0;height:484px;box-sizing:border-box;padding:12px 20px 20px;background:#FFFFFF;border-top:1px solid #D5DCE6;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(15,27,45,0.14);display:flex;flex-direction:column;gap:12px">
    <div style="align-self:center;width:40px;height:4px;border-radius:2px;background:#C5CED9"></div>
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <h1 style="margin:0;font-size:22px;font-weight:800">Choose a vehicle</h1>
      <span style="font-size:13px;font-weight:600;color:#5B6B7F">9.4 km</span>
    </div>

    <div style="display:flex;gap:8px">
      <button type="button" onClick="{{pickW1}}" style="{{w1Style}}"><span style="font-size:15px;font-weight:800">Now</span><span style="font-size:12px;font-weight:600;color:#5B6B7F">arrives by 15:10</span></button>
      <button type="button" onClick="{{pickW2}}" style="{{w2Style}}"><span style="font-size:15px;font-weight:800">16:00</span><span style="font-size:12px;font-weight:600;color:#5B6B7F">to 17:00</span></button>
      <button type="button" onClick="{{pickW3}}" style="{{w3Style}}"><span style="font-size:15px;font-weight:800">17:00</span><span style="font-size:12px;font-weight:600;color:#5B6B7F">to 18:00</span></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button type="button" onClick="{{pickBike}}" style="{{bikeStyle}}">
        <span style="width:44px;height:44px;border-radius:12px;background:#FFFFFF;border:1px solid #E3E8EF;display:flex;align-items:center;justify-content:center;color:#2563E8">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8H8M13 12h-5"/></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:800">Bike</span><span style="font-size:13px;font-weight:500;color:#5B6B7F">Up to 5 kg. Documents, small parcels.</span></span>
        <span style="font-size:18px;font-weight:800">R34.00</span>
      </button>
      <button type="button" onClick="{{pickCar}}" style="{{carStyle}}">
        <span style="width:44px;height:44px;border-radius:12px;background:#FFFFFF;border:1px solid #E3E8EF;display:flex;align-items:center;justify-content:center;color:#2563E8">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3l2-5h12l2 5v3zM4 15v3M20 15v3"/><circle cx="8" cy="13.5" r="1"/><circle cx="16" cy="13.5" r="1"/></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:800">Car</span><span style="font-size:13px;font-weight:500;color:#5B6B7F">Up to 40 kg. Boxes, cakes, groceries.</span></span>
        <span style="font-size:18px;font-weight:800">R52.00</span>
      </button>
      <button type="button" onClick="{{pickVan}}" style="{{vanStyle}}">
        <span style="width:44px;height:44px;border-radius:12px;background:#FFFFFF;border:1px solid #E3E8EF;display:flex;align-items:center;justify-content:center;color:#2563E8">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:800">Van</span><span style="font-size:13px;font-weight:500;color:#5B6B7F">Up to 400 kg. Furniture, stock, pallets.</span></span>
        <span style="font-size:18px;font-weight:800">R96.00</span>
      </button>
    </div>

    <a href="Pay.dc.html" style="display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;background:#2563E8;font-size:17px;font-weight:800;color:#FFFFFF">Continue · {{total}}</a>
    <p style="margin:0;text-align:center;font-size:12px;color:#5B6B7F">The price is fixed. No extra charges.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const veh = s.veh || 'car';
    const win = s.win || 'now';
    const prices = { bike: 34, car: 52, van: 96 };
    const card = (on) => 'display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:66px;text-align:left;border-radius:16px;color:#0F1B2D;font-family:Manrope,sans-serif;cursor:pointer;' +
      (on ? 'padding:9px 13px;border:2px solid #2563E8;background:#E6F0FF;' : 'padding:10px 14px;border:1px solid #D5DCE6;background:#F3F6FA;');
    const chip = (on) => 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;box-sizing:border-box;border-radius:14px;color:#0F1B2D;font-family:Manrope,sans-serif;cursor:pointer;' +
      (on ? 'border:2px solid #2563E8;background:#E6F0FF;' : 'border:1px solid #D5DCE6;background:#F3F6FA;');
    return {
      bikeStyle: card(veh === 'bike'), carStyle: card(veh === 'car'), vanStyle: card(veh === 'van'),
      w1Style: chip(win === 'now'), w2Style: chip(win === 'w2'), w3Style: chip(win === 'w3'),
      pickBike: () => this.setState({ veh: 'bike' }),
      pickCar: () => this.setState({ veh: 'car' }),
      pickVan: () => this.setState({ veh: 'van' }),
      pickW1: () => this.setState({ win: 'now' }),
      pickW2: () => this.setState({ win: 'w2' }),
      pickW3: () => this.setState({ win: 'w3' }),
      total: 'R' + prices[veh] + '.00'
    };
  }
}
</script>
</body>
</html>
