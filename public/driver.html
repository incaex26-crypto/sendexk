<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driver — SenDexk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<link rel="stylesheet" href="app.css">
<style>
  .driver-layout { display: flex; flex-direction: column; gap: 0; }
  .run-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .run-pay { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
  .stop-list { list-style: none; padding: 0; margin: 0; }
  .stop-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .stop-item:last-child { border-bottom: none; }
  .stop-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .stop-addr { font-size: .9rem; line-height: 1.4; }
  .stop-addr .stop-type { font-size: .72rem; color: var(--mute); text-transform: capitalize; margin-bottom: 1px; }
  .action-strip { display: flex; gap: 10px; margin-top: 14px; }
  .scan-section { margin-top: 18px; }
  #scan-out { margin-top: 8px; min-height: 1.4em; }
  #no-runs { color: var(--mute); text-align: center; padding: 40px 0; font-size: .95rem; }
</style>
</head>
<body>
<div class="driver-layout">

<!-- Map takes top half -->
<div class="map-wrap" style="border-radius:0;margin:0">
  <div id="map" style="height:50vh;min-height:220px"></div>
</div>

<!-- Panel below map -->
<div class="page" style="padding-top:18px">

<header class="page-head" style="margin-bottom:14px">
  <h1>Driver</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <nav><a href="/">Book</a><a href="/admin.html">Ops</a></nav>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☾ Dark</button>
  </div>
</header>

<div id="run-panel">
  <div id="no-runs">No runs assigned to you right now. Check back soon.</div>
</div>

<div id="scan-section" class="scan-section" style="display:none">
  <h2>Scan delivery code</h2>
  <p class="text-mute" style="margin:0 0 8px">Type the code the recipient gives you at drop-off.</p>
  <div style="display:flex;gap:8px">
    <input id="scan-input" placeholder="e.g. A3F9" style="width:auto;flex:1;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase">
    <button class="btn btn-primary btn-sm" id="scan-btn" style="width:auto">Confirm</button>
  </div>
  <p id="scan-out" class="text-mute"></p>
</div>

</div>
</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js"
        integrity="sha384-QfbOCebHNw8pQiPAOd2IFee2v2A5VYZxBk0+JGZ5H+3mfzVIp6zsQNkTsfGJot93" crossorigin="anonymous"></script>
<script>
let _map = null, currentRun = null;

(async () => {
  const region = await api('GET', '/api/region').catch(() => null);
  _map = tileMap($('#map'), region || {
    center: { lat: -26.1, lng: 28.05 },
    map: null,
  }, { height: '50vh', zoom: 12 });

  await loadRuns(region);
})();

async function loadRuns(region) {
  let runs;
  try { runs = await api('GET', '/api/runs'); } catch { runs = []; }

  const active = runs.filter(r => ['assigned', 'in_progress'].includes(r.status));
  if (!active.length) { $('#run-panel').innerHTML = '<div id="no-runs">No runs assigned to you right now. Check back soon.</div>'; return; }

  currentRun = active[0];
  const stops = currentRun.stops || [];
  const pay = currentRun.driverPay ?? currentRun.price ?? 0;

  const markers = stops.map((s, i) => ({
    lat: s.lat, lng: s.lng,
    type: s.type === 'pickup' ? 'pickup' : 'drop',
    label: String(i + 1),
    popup: `<b>${i + 1}. ${s.type === 'pickup' ? 'Pickup' : 'Drop-off'}</b><br>${s.address || ''}`,
  }));

  if (_map && markers.length) _map.setMarkers(markers);

  const stopItems = stops.map((s, i) => `
    <li class="stop-item">
      <span class="stop-num">${i + 1}</span>
      <div class="stop-addr">
        <div class="stop-type">${s.type === 'pickup' ? 'Pick up' : 'Drop off'}</div>
        ${s.address || 'Address not set'}
      </div>
    </li>`).join('');

  $('#run-panel').innerHTML = `
    <div class="run-header">
      <div>
        <div class="text-mute" style="font-size:.78rem;margin-bottom:2px">Run #${currentRun.id}</div>
        <h2 style="margin:0">${stops.length} stop${stops.length !== 1 ? 's' : ''}</h2>
      </div>
      <div class="run-pay">${R(pay)}</div>
    </div>
    <ul class="stop-list">${stopItems || '<li class="stop-item"><span class="text-mute">No stops yet.</span></li>'}</ul>
    ${currentRun.status === 'assigned' ? `
    <div class="action-strip">
      <button class="btn btn-primary" id="accept-btn">Accept run for ${R(pay)}</button>
      <button class="btn btn-secondary" id="decline-btn">Decline</button>
    </div>` : `
    <div class="action-strip">
      <span class="pill ok">In progress</span>
    </div>`}`;

  $('#scan-section').style.display = 'block';

  const ab = $('#accept-btn');
  if (ab) ab.onclick = async () => {
    try {
      await api('POST', `/api/runs/${currentRun.id}/accept`);
      ab.textContent = 'Run accepted'; ab.disabled = true;
      $('#decline-btn')?.remove();
      document.querySelector('.action-strip').insertAdjacentHTML('beforeend', '<span class="pill ok" style="margin-left:4px">In progress</span>');
    } catch (e) { ab.insertAdjacentHTML('afterend', `<p class="text-err" style="margin:6px 0 0">${e.message}</p>`); }
  };

  const db = $('#decline-btn');
  if (db) db.onclick = async () => {
    if (!confirm('Decline this run?')) return;
    try { await api('POST', `/api/runs/${currentRun.id}/decline`); await loadRuns(region); }
    catch (e) { db.insertAdjacentHTML('afterend', `<p class="text-err" style="margin:6px 0 0">${e.message}</p>`); }
  };
}

$('#scan-btn').onclick = async () => {
  const code = ($('#scan-input').value || '').trim().toUpperCase();
  if (!code) { $('#scan-out').textContent = 'Enter the code first.'; $('#scan-out').className = 'text-err'; return; }
  try {
    await api('POST', '/api/scan', { code, runId: currentRun?.id });
    $('#scan-out').textContent = 'Delivery confirmed.';
    $('#scan-out').className = 'text-ok';
    $('#scan-input').value = '';
  } catch (e) {
    $('#scan-out').textContent = e.message + '. Try again or call ops.';
    $('#scan-out').className = 'text-err';
  }
};

$('#scan-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('#scan-btn').click(); });
</script>
</body>
</html>
