<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirm and pay — SenDexk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body { background: var(--sheet); }
.route-col { display:flex;flex-direction:column;align-items:center;padding-top:5px; }
.page-header { display:flex;align-items:center;gap:12px;padding:20px 16px 0; }
.scroll-body { padding: 0 16px; padding-bottom: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.footer { position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--border);padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px; }
</style>
</head>
<body>
<div class="page-header">
  <a href="choose.html" class="nav-pill" style="position:static;width:48px;height:48px;border-radius:24px;padding:0;justify-content:center" aria-label="Back">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <h1>Confirm and pay</h1>
</div>

<div class="scroll-body">
  <!-- Trip summary -->
  <div class="card" id="summary-card">
    <div class="row" style="gap:14px;align-items:flex-start">
      <div class="route-col">
        <div class="dot-pickup"></div>
        <div class="dot-line" style="height:30px"></div>
        <div class="dot-drop"></div>
      </div>
      <div class="col" style="gap:14px;flex:1">
        <div class="col"><span class="label">Pickup</span><span style="font-size:15px;font-weight:700" id="pickup-addr">—</span></div>
        <div class="col"><span class="label">Drop-off</span><span style="font-size:15px;font-weight:700" id="drop-addr">—</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between;font-size:14px"><span style="color:var(--mute);font-weight:600">Vehicle</span><span style="font-weight:700" id="veh-label">—</span></div>
    <div class="row" style="justify-content:space-between;font-size:14px"><span style="color:var(--mute);font-weight:600">Delivery fee</span><span style="font-weight:800" id="fee-label">—</span></div>
  </div>

  <!-- Recipient -->
  <div style="display:flex;gap:10px">
    <div class="col" style="flex:1;gap:6px">
      <label for="rname" class="label">Recipient name</label>
      <input id="rname" type="text" placeholder="Full name">
    </div>
    <div class="col" style="flex:1;gap:6px">
      <label for="rphone" class="label">Recipient phone</label>
      <input id="rphone" type="tel" placeholder="+27 …">
    </div>
  </div>

  <!-- Sender -->
  <div class="col" style="gap:6px">
    <label for="sname" class="label">Your name</label>
    <input id="sname" type="text" placeholder="Full name">
  </div>

  <!-- Pay with -->
  <div class="col" style="gap:8px">
    <span style="font-size:14px;font-weight:800">Pay with</span>
    <button class="pay-row" id="wallet-row" style="display:none" data-m="wallet">
      <span class="radio-dot" id="wallet-dot"></span>
      <span class="flex1 col"><span style="font-size:15px;font-weight:700">Wallet</span><span style="font-size:12px;font-weight:500;color:var(--mute)" id="wallet-bal-label"></span></span>
    </button>
    <button class="pay-row selected" id="card-row" data-m="card">
      <span class="radio-dot checked" id="card-dot"></span>
      <span class="flex1" style="font-size:15px;font-weight:700">Card</span>
    </button>
    <button class="pay-row" id="eft-row" data-m="eft">
      <span class="radio-dot" id="eft-dot"></span>
      <span class="flex1" style="font-size:15px;font-weight:700">Instant EFT</span>
    </button>
  </div>

  <div id="err-msg" class="err" style="display:none"></div>
</div>

<div class="footer">
  <p style="margin:0;font-size:12px;line-height:1.4;color:var(--mute)">The recipient gets a 4-digit code by message and gives it to the driver to confirm delivery.</p>
  <button class="btn btn-primary" id="pay-btn">Pay <span id="pay-amount">—</span></button>
</div>

<script>
const ss = k => JSON.parse(sessionStorage.getItem('book.' + k) || 'null');
let selMethod = 'card', walletBal = 0, orderId = null, region;

async function init() {
  region = await fetch('/api/region').then(r => r.json());
  const p = ss('pickup'), d = ss('drop'), v = ss('vehicle'), cap = ss('capCents');
  document.getElementById('pickup-addr').textContent = p ? (p.address || `${p.lat.toFixed(4)},${p.lng.toFixed(4)}`) : '—';
  document.getElementById('drop-addr').textContent = d ? (d.address || `${d.lat.toFixed(4)},${d.lng.toFixed(4)}`) : '—';
  document.getElementById('veh-label').textContent = v ? (region.vehicles && region.vehicles[v] ? region.vehicles[v].label : v) : '—';
  document.getElementById('fee-label').textContent = cap ? fmtR(cap) : '—';
  document.getElementById('pay-amount').textContent = cap ? fmtR(cap) : '—';

  // Check wallet
  const w = await fetch('/api/wallet', { credentials: 'include' }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (w) {
    walletBal = w.balanceCents;
    document.getElementById('wallet-row').style.display = 'flex';
    document.getElementById('wallet-bal-label').textContent = 'Balance ' + fmtR(walletBal);
    if (walletBal >= (cap || 0)) pickMethod('wallet');
  }

  // Pay method buttons
  ['wallet', 'card', 'eft'].forEach(m => {
    const row = document.getElementById(m + '-row');
    if (row) row.onclick = () => pickMethod(m);
  });

  document.getElementById('pay-btn').onclick = pay;
}

function pickMethod(m) {
  selMethod = m;
  ['wallet', 'card', 'eft'].forEach(x => {
    const row = document.getElementById(x + '-row');
    const dot = document.getElementById(x + '-dot');
    if (row) { row.classList.toggle('selected', x === m); if (dot) dot.className = 'radio-dot' + (x === m ? ' checked' : ''); }
  });
}

async function pay() {
  const btn = document.getElementById('pay-btn');
  btn.disabled = true; btn.textContent = 'Processing…';
  document.getElementById('err-msg').style.display = 'none';
  try {
    const p = ss('pickup'), d = ss('drop'), v = ss('vehicle');
    if (!p || !d || !v) throw new Error('Please set pickup and drop-off first.');
    const rname = document.getElementById('rname').value.trim();
    const rphone = document.getElementById('rphone').value.trim();
    const sname = document.getElementById('sname').value.trim();
    if (!rname || !rphone) throw new Error('Please enter the recipient name and phone number.');

    // Create order
    const or = await post('/api/orders', {
      vehicleClass: v, weightKg: 2, category: 'parcel',
      sender: { name: sname || 'Customer', phone: '' },
      recipient: { name: rname, phone: rphone },
      pickup: p, drop: d,
    });
    orderId = or.order.id;

    if (selMethod === 'wallet') {
      const wr = await post('/api/wallet/pay/' + orderId, {});
      window.location.href = 'confirm.html?t=' + wr.confirmUrl.split('t=')[1];
    } else {
      // Get payment link, redirect to provider (or simulate in dev)
      const pr = await post('/api/orders/' + orderId + '/payment', {});
      // In dev the fake URL includes ?ref=..., redirect there then handle
      window.location.href = pr.payUrl;
    }
  } catch (e) {
    const el = document.getElementById('err-msg');
    el.textContent = e.message || 'Something went wrong. Please try again.';
    el.style.display = 'block';
    btn.disabled = false; btn.innerHTML = 'Pay <span id="pay-amount">' + fmtR(ss('capCents') || 0) + '</span>';
  }
}

function post(url, body) {
  return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) })
    .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; });
}
function fmtR(c) { return 'R' + (c / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

init();
</script>
</body>
</html>
